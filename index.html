<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melbourne '26</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Melbourne">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Pacifico&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{
  --bg:#F3F4F6;            /* bluestone grey */
  --surface:#FFFFFF;
  --fill:#E9EBEF;          /* search fields, segmented track */
  --fill-2:#F5F6F8;
  --ink:#101318;
  --ink-2:#5D6470;
  --ink-3:#9AA0AA;
  --sep:rgba(16,19,24,.09);
  --tram:#0F7A5A;          /* Melbourne tram green */
  --tram-deep:#0A5C44;
  --tram-tint:rgba(15,122,90,.10);
  --yellow:#FFC93C;        /* tram stripe */
  --red:#E5484D; --orange:#F2711C;
  --c-food:#F2711C; --c-cafe:#9C6B3F; --c-night:#5B5BD6; --c-event:#D6409F; --c-place:#12A594; --c-fixed:#6B7280; --c-custom:#0F7A5A; --c-shop:#0A84FF;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --bar-blur:saturate(180%) blur(20px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--surface:#1C1C1E;--fill:#2C2C2E;--fill-2:#232325;--ink:#F5F5F7;--ink-2:#A1A1A6;--ink-3:#6E6E73;--sep:rgba(255,255,255,.10);
    --tram:#21A67A;--tram-deep:#0F7A5A;--tram-tint:rgba(33,166,122,.16);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.29;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tram);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.app{max-width:600px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(96px + env(safe-area-inset-bottom))}

/* ===== Compact nav bar (appears on scroll) ===== */
.navbar{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:var(--bar-blur);backdrop-filter:var(--bar-blur);border-bottom:.5px solid transparent;opacity:0;pointer-events:none;transition:opacity .18s,border-color .18s}
.navbar.on{opacity:1;pointer-events:auto;border-bottom-color:var(--sep)}
.navbar .in{max-width:600px;margin:0 auto;height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px}

/* ===== Large title ===== */
.lt{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 20px 8px}
.lt h1{margin:0;font-family:var(--font-d);font-size:34px;line-height:41px;font-weight:700;letter-spacing:.012em}
.lt .sub{font-size:15px;color:var(--ink-2);margin-top:1px}
.sync{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.live i{background:#30A46C}
.sync.warn i{background:var(--orange)}

/* ===== Trip ticket (hero) ===== */
.ticket{margin:8px 16px 18px;border-radius:var(--r-lg);background:var(--tram);color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 30px -12px rgba(10,92,68,.55)}
.ticket::before{content:"";position:absolute;left:0;right:0;top:62%;height:7px;background:var(--yellow)}
.tk-top{padding:16px 18px 30px;position:relative}
.tk-row{display:flex;justify-content:space-between;align-items:flex-start}
.tk-count{font-family:var(--font-d);font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
.tk-count small{display:block;font-size:15px;font-weight:500;letter-spacing:0;opacity:.85;margin-top:6px}
.tk-route{text-align:right;font-size:13px;opacity:.9;line-height:1.45}
.tk-route b{display:block;font-size:20px;font-weight:700;letter-spacing:.04em;opacity:1}
.tk-bottom{background:var(--tram-deep);padding:16px 18px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.tk-bottom::before,.tk-bottom::after{content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.tk-bottom::before{left:-9px}.tk-bottom::after{right:-9px}
.tk-cell span{display:block;font-size:12px;opacity:.7}
.tk-cell b{display:block;font-size:15px;font-weight:600;margin-top:2px}

/* ===== Section headers ===== */
.sh{display:flex;justify-content:space-between;align-items:baseline;padding:0 20px;margin:4px 0 8px}
.sh h2{margin:0;font-size:22px;line-height:28px;font-weight:700;font-family:var(--font-d)}
.sh span{font-size:15px;color:var(--ink-2)}

/* ===== Week strip ===== */
.week{display:flex;gap:0;padding:0 10px 12px;overflow-x:auto;scrollbar-width:none}
.week::-webkit-scrollbar{display:none}
.wd{flex:1 0 42px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 4px;border-radius:12px}
.wd span{font-size:12px;font-weight:600;color:var(--ink-3)}
.wd b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.wd i{width:5px;height:5px;border-radius:50%;background:transparent}
.wd.has i{background:var(--ink-3)}
.wd.sel b{background:var(--tram);color:#fff}
.wd.sel span{color:var(--tram)}
.wd.today:not(.sel) b{color:var(--tram)}

/* ===== Inset grouped list ===== */
.group{margin:0 16px 16px;background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px 11px 12px;width:100%;text-align:left;position:relative;min-height:60px}
.row + .row::before{content:"";position:absolute;top:0;left:60px;right:0;height:.5px;background:var(--sep)}
.row:active{background:var(--fill-2)}
.tile{flex:0 0 36px;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--c);color:#fff}
.tile svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rb{flex:1;min-width:0}
.rt{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:15px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.rm .warn{color:var(--red);font-weight:600}
.rm .open{color:#2B9A66;font-weight:600}
.rm .star{color:var(--ink);font-weight:600}
.rm .star::before{content:"★";color:#F5A623;margin-right:2px}
.time{flex:0 0 52px;text-align:right;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.time small{display:block;font-size:12px;font-weight:500;color:var(--ink-3)}
.av{flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.chev{flex:0 0 auto;color:var(--ink-3)}
.links .row{min-height:56px}
.links .row + .row::before{left:62px}
.chev svg{width:8px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.add-mini{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:var(--tram-tint);color:var(--tram);display:grid;place-items:center}
.add-mini svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.add-mini.done{background:var(--tram);color:#fff}

.empty{margin:0 16px 16px;background:var(--surface);border-radius:var(--r-md);padding:26px 22px;text-align:center}
.empty h3{margin:0 0 4px;font-size:17px;font-weight:600}
.empty p{margin:0 0 14px;color:var(--ink-2);font-size:15px}
.note-banner{margin:0 16px 14px;padding:12px 14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--orange) 12%,var(--surface));font-size:15px;color:var(--ink)}
.namecard{margin:0 16px 16px;background:var(--surface);border-radius:var(--r-md);padding:16px}
.namecard h3{margin:0 0 2px;font-size:17px;font-weight:600}
.namecard p{margin:0 0 12px;font-size:15px;color:var(--ink-2)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 20px;border-radius:14px;background:var(--tram);color:#fff;font-size:17px;font-weight:600}
.btn{white-space:nowrap}
.btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;flex:0 0 auto}
.btn:active{opacity:.85}
.btn.tinted{background:var(--tram-tint);color:var(--tram)}
.btn.plain{background:var(--fill);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.btn.sm{height:36px;padding:0 14px;font-size:15px;border-radius:18px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45}
.textbtn{color:var(--tram);font-size:17px;font-weight:500}

/* ===== Explore controls ===== */
.seg{display:flex;margin:4px 16px 12px;background:var(--fill);border-radius:10px;padding:2px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{margin:0 16px 10px;display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:10px;background:var(--fill);color:var(--ink-3)}
.search svg{flex:0 0 16px;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:17px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.filters{position:sticky;top:calc(env(safe-area-inset-top) + 44px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:var(--bar-blur);backdrop-filter:var(--bar-blur);padding:8px 0 10px;margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:17px;background:var(--surface);font-size:15px;font-weight:500;white-space:nowrap;box-shadow:inset 0 0 0 .5px var(--sep)}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chip .n{color:var(--ink-3);margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on .n{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.ctl{display:flex;gap:8px;padding:8px 16px 0}
.sortpill{position:relative;display:inline-flex;align-items:center;height:30px;border-radius:15px;background:var(--fill);padding:0 28px 0 12px;font-size:14px;font-weight:600;color:var(--ink)}
.sortpill select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}
.sortpill::after{content:"";position:absolute;right:11px;top:11px;width:6px;height:6px;border-right:1.8px solid var(--ink-2);border-bottom:1.8px solid var(--ink-2);transform:rotate(45deg)}
.toggle{display:inline-flex;align-items:center;gap:6px;height:30px;border-radius:15px;background:var(--fill);padding:0 12px;font-size:14px;font-weight:600}
.toggle.on{background:var(--tram);color:#fff}
.count{margin-left:auto;align-self:center;font-size:13px;color:var(--ink-3)}
.foot{padding:4px 32px 12px;font-size:13px;color:var(--ink-3);line-height:1.4}

/* ===== Tab bar ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:var(--bar-blur);backdrop-filter:var(--bar-blur);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:52px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;min-width:0;font-weight:500;color:var(--ink-3);letter-spacing:.01em;position:relative}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--tram)}
.tab.on svg .fillable{fill:currentColor;fill-opacity:.18}
.tab em{position:absolute;top:3px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 4px}

/* ===== Sheet ===== */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:600px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(102%);transition:transform .34s cubic-bezier(.32,.72,0,1);padding:0 0 calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.45;margin:6px auto 0}
.sh-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 2px;min-height:44px}
.sh-bar .ttl{font-weight:600;font-size:17px}
.closex{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink-2)}
.closex svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.dv-head{padding:4px 20px 14px;display:flex;gap:14px;align-items:center}
.dv-head .tile{flex-basis:56px;width:56px;height:56px;border-radius:14px}
.dv-head .tile svg{width:30px;height:30px}
.dv-head h2{margin:0;font-family:var(--font-d);font-size:24px;line-height:1.15;font-weight:700}
.dv-head p{margin:3px 0 0;font-size:15px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:0 16px 14px;background:var(--surface);border-radius:var(--r-md);padding:12px 0}
.stat{text-align:center;padding:0 4px;position:relative}
.stat + .stat::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:.5px;background:var(--sep)}
.stat span{display:block;font-size:12px;color:var(--ink-3);margin-bottom:3px}
.stat b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stat b.open{color:#2B9A66}.stat b.closed{color:var(--red)}
.para{margin:0 20px 14px;font-size:17px;line-height:1.42}
.known{margin:0 16px;background:var(--surface);border-radius:var(--r-md);padding:12px 16px;font-size:16px;line-height:1.4}
.bestfor{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.bestfor span{height:30px;display:inline-flex;align-items:center;padding:0 12px;border-radius:15px;background:var(--tram-tint);color:var(--tram);font-size:14px;font-weight:600}
.tipbox{margin:0 16px 14px;padding:12px 14px;border-radius:var(--r-md);background:var(--tram-tint);font-size:15px;line-height:1.4;color:var(--ink)}
.tipbox b{color:var(--tram);font-weight:600}
.kv{margin:0 16px 14px;background:var(--surface);border-radius:var(--r-md);padding:4px 0}
.kv div{display:flex;justify-content:space-between;padding:9px 16px;font-size:15px;position:relative}
.kv div + div::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.kv span{color:var(--ink-2)}
.kv .today span,.kv .today b{color:var(--tram);font-weight:600}
.kv b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:var(--bar-blur);backdrop-filter:var(--bar-blur);margin-top:4px}
.actions .btn{flex:1}
.lbl{padding:0 32px;margin:16px 0 7px;font-size:13px;color:var(--ink-2)}
.days7{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
.dchip{height:52px;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--ink-2);font-weight:500}
.dchip b{font-size:17px;color:var(--ink);font-weight:600}
.dchip.on{background:var(--tram);color:rgba(255,255,255,.8)}
.dchip.on b{color:#fff}
.dchip[disabled]{opacity:.35}
textarea.field.notes{height:auto;min-height:104px;padding:12px 14px;line-height:1.4;resize:none;font-family:inherit}
.ncount{padding:4px 32px 0;text-align:right;font-size:12px;color:var(--ink-3)}
.row.hasnote{align-items:flex-start}
.row.hasnote .time{padding-top:4px}
.row.hasnote .av{margin-top:6px}
.booked{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9px;background:var(--tram-tint);color:var(--tram);font-size:11.5px;font-weight:700;letter-spacing:.01em}
.booked.big{height:26px;padding:0 11px;font-size:13px;border-radius:13px}
.trange{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.trange label{display:block;min-width:0}
.trange span{display:block;font-size:12px;color:var(--ink-3);margin:0 0 4px 4px}
.trange .field{width:100%;margin:0}
.row.split{align-items:flex-start;padding-top:10px;padding-bottom:10px}
.row.split .time{padding-top:6px}
.cols{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;overflow-x:auto}
.mc{min-width:0;text-align:left;background:var(--fill-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;box-shadow:inset 0 0 0 .5px var(--sep)}
.mc:active{background:var(--fill)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.mh .tile{width:30px;height:30px;flex-basis:30px;border-radius:8px}
.mh .tile svg{width:17px;height:17px}
.av.sm{width:20px;height:20px;flex-basis:20px;font-size:10px}
.mn{font-size:15px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ms{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:12.5px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.mc .booked{align-self:flex-start;margin-top:3px}
.mnote{font-size:12.5px;color:var(--ink-2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.row.split + .row::before,.row + .row.split::before{left:72px}
.pnote{display:flex;gap:6px;align-items:flex-start;margin-top:7px;padding:8px 10px;border-radius:10px;background:var(--fill-2);font-size:14px;line-height:1.35;color:var(--ink);white-space:pre-wrap}
.pnote svg{flex:0 0 14px;width:14px;height:14px;margin-top:2px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pnote span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.iconpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px 4px;padding:0 12px}
.ip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;border-radius:12px}
.ip .tile{width:40px;height:40px;flex-basis:40px;border-radius:11px;opacity:.9}
.ip small{font-size:11px;color:var(--ink-2);white-space:nowrap}

.sb-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}

.sb-vs{font-size:13px;font-weight:700;color:var(--ink-3)}

.prize{display:block;width:calc(100% - 32px);margin:0 16px 14px;border-radius:16px;overflow:hidden;position:relative;color:#fff;padding:16px 14px 14px;text-align:center;

.prize::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:16px;margin-left:-8px;background:linear-gradient(90deg,#E5484D,#FF7A85,#E5484D)}
.prize::after{content:"";position:absolute;left:0;right:0;top:44px;height:14px;background:linear-gradient(#E5484D,#FF7A85,#E5484D)}
.prize .bow{position:absolute;left:50%;top:30px;width:0;height:0;z-index:2}
.prize .bow::before,.prize .bow::after{content:"";position:absolute;top:-14px;width:28px;height:22px;border:5px solid #FF6B78;border-radius:50%/60% 60% 40% 40%;background:rgba(255,107,120,.25)}
.prize .bow::before{right:2px;transform:rotate(-24deg)}.prize .bow::after{left:2px;transform:rotate(24deg)}
.prize .gtag{position:relative;z-index:3;display:inline-block;background:#fff;color:#B45309;font-weight:700;font-size:14px;padding:5px 10px;border-radius:8px;transform:rotate(-3deg);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.prize .gwhen,.prize .cdown,.prize .gready{position:relative;z-index:3}
.prize .gwhen{margin-top:46px;font-size:13px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.prize .cdown{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.prize .cdown div{background:rgba(90,50,0,.35);border-radius:10px;padding:7px 0 6px}
.prize .cdown b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.prize .cdown small{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;opacity:.9;margin-top:3px}
.prize .gready{margin-top:46px;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.prize.ready{animation:giftglow 1.6s ease-in-out infinite}
.prize.shake{animation:gshake .5s ease}
/* ===== Love letter ===== */
#letter{position:fixed;inset:0;z-index:310;background:radial-gradient(circle at 50% 40%,#FFF3C4,#FFD66B 55%,#F4A93A);opacity:0;transition:opacity .5s;overflow:hidden}

#letter[hidden]{display:none}
.l-stage{position:absolute;inset:0;display:grid;place-items:center;perspective:900px}
.l-env{position:relative;width:280px;height:180px}
.l-back{position:absolute;inset:0;background:#F3DDB3;border-radius:10px;box-shadow:0 20px 40px -18px rgba(120,60,0,.6)}
.l-paper{position:absolute;left:16px;right:16px;top:10px;height:160px;background:#FFFDF6;border-radius:6px;z-index:1;display:flex;justify-content:center;padding-top:16px;font:600 20px "Caveat",cursive;color:#8A4B12;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.l-front{position:absolute;inset:0;z-index:2;border-radius:10px;background:

  hereford:{about:"A polished steakhouse hidden down Duckboard Place beside AC/DC Lane, with a bar at the front, a wine-lined corridor and an open kitchen where you can watch the grill. It's been a Melbourne steak institution for years.",known:"Tomahawk to share, dry-aged sirloin on the bone, beef ribs and the duck liver parfait to start.",best:["Steak night","Date night","Special occasion"]},
  lucyliu:{about:"A dark, glamorous pan-Asian restaurant and bar tucked down Oliver Lane, just off Flinders Lane. It's lively without being too loud, serves shared plates from across Asia, and is known for friendly, genuinely attentive service and good value for the CBD.",known:"Handmade dumplings (prawn and spinach, mushroom), steamed flathead, scallop fried rice, fresh oysters and the '5 plate surprise'.",best:["Date night","Groups","Walk-ins"]},
  chinchin:{about:"A loud, high-energy Thai canteen on Flinders Lane from restaurateur Chris Lucas. Big share plates, punchy flavours and a soundtrack that's always turned up. Service is fast even when it's packed, and solo diners can sit at the kitchen counter to watch the chefs.",known:"The Feed Me banquet (the chef picks for the table), kingfish sashimi, corn fritters and the roast duck.",best:["Groups","Lively dinner","First night"]},
  supernormal:{about:"Andrew McConnell's sleek take on modern Asian dining: a long, moody room where Japanese, Korean and Chinese ideas meet Melbourne produce. Polished but relaxed, and one of the city's most consistent restaurants.",known:"The New England lobster roll, seared tuna on nori crackers, raw snapper with ponzu and the peanut butter parfait.",best:["Date night","Solo at the bar","Foodies"]},
  tipo00:{about:"A tiny, always-full pasta bar on Little Bourke St where everything is made by hand in-house. Warm, characterful service and a wine list leaning Italian. Tables book out weeks ahead, so book as soon as you can.",known:"Squid-ink tagliolini, wagyu pappardelle, crab risotto and the 'Tipomisu' chocolate dessert.",best:["Date night","Pasta lovers"]},
  gimlet:{about:"Andrew McConnell's grand dining room inside 1920s Cavendish House: marble, curved banquettes and white-jacketed waiters. It feels like an old New York supper club, with very good seafood and steak. Off-peak tables like 3:30pm are often easier to get.",known:"Raw seafood, steak cooked over coals, beef tartare and, of course, a Gimlet.",best:["Special occasion","Martinis","Splurge"]},
  flowerdrum:{about:"Melbourne's most celebrated Cantonese restaurant, open since 1975. It's an elegant upstairs dining room down Market Lane with famously gracious, old-school service. A Melbourne institution worth doing once.",known:"Peking duck carved at your table, handmade dim sum at lunch and the lamb claypot.",best:["Special occasion","Classic Melbourne"]},
  embla:{about:"A dim, buzzy wine bar built around an open wood-fired grill. You sit at the counter and watch the chefs, or squeeze in at a candlelit table. Small, inventive plates and a long list of natural and small-producer wines.",known:"Crispy chicken-skin crisps, grilled whole calamari, mushroom tarts and whatever the staff recommend by the glass.",best:["Date night","Wine","Walk-ins at the bar"]},
  grossi:{about:"One of Melbourne's oldest fine-dining rooms, with murals, chandeliers and white tablecloths on Bourke St's 'Paris end'. Refined Italian cooking in generous portions, with polished, old-world service.",known:"Mushroom risotto, steak, house-made gelato and a serious Italian wine list.",best:["Special occasion","Old-world glamour"]},
  pastuso:{about:"Modern Peruvian food down graffiti-lined ACDC Lane: zingy ceviche, a charcoal grill and plenty of pisco. Upbeat and great for sharing. The team is warm and happy to guide you through the menu.",known:"Ceviche, tiradito, chargrilled steak, pisco sours and the 'Andean Experience' set menu.",best:["Groups","Something different","Cocktails"]},
  leehofook:{about:"Chef Victor Liong's modern Chinese restaurant in a hidden laneway: classic dishes reworked with real finesse. Dark, intimate room with a chef's counter. Attentive service that often marks special occasions.",known:"Crispy eggplant, prawn toast, grilled scallops with Chinese spices and the pre-ordered dry-aged Peking duck.",best:["Date night","Foodies"]},
  mamasita:{about:"An upstairs Collins St cantina credited with kick-starting Melbourne's Mexican food scene. Loud, colourful and fun, with one of the city's biggest tequila and mezcal lists. Handy for the theatres at the top of town.",known:"Chargrilled street corn, guacamole, tacos and a margarita or mezcal flight.",best:["Pre-theatre","Cocktails","Groups"]},
  stalactites:{about:"A Greek institution open since 1978, famous for its cave-like interior and late nights. Fast, cheerful and always busy. Expect a short queue at peak times, but tables turn quickly.",known:"Mixed giro platter, lamb souvlaki on the skewer, dips with warm pita and loukoumades for dessert.",best:["Late night","Cheap eats","After a show"]},
  shujinko:{about:"A compact, Japanese-style ramen bar that stays open till midnight, or 4am on weekends. Rich pork-bone broths, quick service and condiments on every table to customise your bowl.",known:"Classic tonkotsu, the spicy 'kara' ramen, black garlic ramen and chicken wings with wasabi mayo.",best:["Late night","Quick bite"]},
  rockpool:{about:"The steakhouse founded by Neil Perry, set in a dark, glamorous room at Crown with an open grill and a wood fire. The service is excellent and the wine cellar is huge. Pricey, but it's one of the best steak dinners in the country.",known:"Dry-aged and wagyu steaks, chargrilled king prawns, truffled scallops and the burger at the bar.",best:["Splurge","Steak night"]}, 
  higherground:{about:"A café inside a converted 1920s power station, with soaring ceilings, greenery and natural light. It's the closest good brunch to the Airbnb and the obvious first breakfast. It gets busy on weekends, so book if you can.",known:"Hotcakes, chilli scrambled eggs and avocado on a pretzel.",best:["First breakfast","Brunch"]},
  patricia:{about:"A standing-room-only espresso bar hidden in a laneway, consistently rated among Melbourne's best coffee. The menu is basically 'white, black or filter', made with real precision. Weekdays only.",known:"Flat white, the filter of the day and the cinnamon scroll.",best:["Coffee fix","Weekday mornings"]},
  hash:{about:"A playful brunch café on Hardware St known for inventive dishes and theatrical drinks. There's a mezzanine upstairs, and staff are genuinely friendly.",known:"The famous hot chocolate (poured at the table from a cloud of fairy floss), 12-hour short rib and hotcakes.",best:["Brunch","Sweet tooth"]},
  bbb:{about:"Seven Seeds' tiny city coffee bar, famous for the wooden chairs hanging from the ceiling. A handful of seats, a great flat white and beans to take home. It takes 10 minutes and is very Melbourne.",known:"Flat white, single-origin espresso and Seven Seeds beans.",best:["Coffee on the go","Quick photo stop"]},
  degraves:{about:"A cosy, old-school café on Degraves St, the city's most famous laneway. Grab a window seat or an outdoor table and watch Melbourne go by. Big, generous breakfasts.",known:"The chilli scramble, pulled pork benedict and French toast.",best:["Laneway atmosphere","Big breakfast"]},
  pellegrinis:{about:"Opened in 1954 and barely changed since: a long Formica counter, the original espresso culture and home-style pasta. There's no printed menu, so just ask what's on. A living piece of Melbourne history.",known:"Spaghetti napoli, watermelon granita, tiramisu and a short black at the counter.",best:["Classic Melbourne","Pre-theatre"]},
  marketlane:{about:"One of Melbourne's best specialty roasters, with a little shop right at Queen Victoria Market. A calm pocket of great coffee among the bustle, with sunny outdoor seats along the walkway.",known:"Seasonal espresso, single-origin filter and cascara tea.",best:["Market morning","Coffee nerds"]},
  lune:{about:"Kate Reid, a former Formula 1 aerodynamicist, set out to make the perfect croissant. Lune's are often called the best in the world. Watch the pastry being laminated in a glass 'cube' in a huge brick warehouse.",known:"Classic croissant, almond croissant, pain au chocolat and the rotating specials.",best:["Must-do","Early start"]},
  industrybeans:{about:"A bright, minimalist café attached to its own roastery in Fitzroy, with views straight into the roasting room. Inventive brunch and some of the most interesting coffee in the city.",known:"Bubble waffles, signature coffee drinks and the IB hollandaise eggs.",best:["Brunch","Coffee nerds"]},
  sevenseeds:{about:"The roastery café that helped define Melbourne's specialty coffee scene, in a relaxed warehouse in Carlton. Excellent pour-overs and a simple, well-done brunch menu. It's an easy stop on the way to or from Queen Vic Market.",known:"Pour-overs, house-blend flat whites, fruit toast and roti with chicken.",best:["Coffee nerds","Near the market"]},
  krimper:{about:"Hidden down Guildford Lane in an old joinery workshop, with high ceilings and vintage decor. One of the calmer cafés in the city. The brunch menu has Asian twists and changing specials.",known:"Beef bulgogi benedict, waffles with bacon and zucchini fritters.",best:["Quiet brunch","Close to home"]},
  luibar:{about:"Vue de monde's cocktail bar on level 55 of the Rialto, with floor-to-ceiling windows over the whole city. Inventive cocktails, refined bar snacks and impeccable service. Book ahead, then take the south lifts up from the Rialto lobby.",known:"Signature cocktails at sunset, the cheese and onion tart, fried chicken and kangaroo snags.",best:["Date night","Views","Sunset"]},
  rooftop:{about:"Melbourne's original rooftop bar, on top of the Curtin House 'vertical laneway' on Swanston St. Astroturf, deckchairs and skyline views. Casual and unpretentious, and Rooftop Cinema runs up here in summer.",known:"Jugs of beer, happy hour and outdoor films in summer.",best:["Casual drinks","Sunset"]},
  section8:{about:"A bar built out of a shipping container in a Chinatown car park, with graffiti walls, milk-crate seats and DJs. Semi-outdoor, friendly and very laneway-Melbourne.",known:"Cheap drinks, good cocktails and weekend DJ sets.",best:["Laneway vibe","Pre-drinks"]},
  siglo:{about:"An elegant rooftop terrace above The European, looking straight at Parliament House. A Champagne-and-cigars kind of place with heaters on cool nights. There's sometimes a short wait on the stairs for a table.",known:"Classic cocktails, Champagne, whisky and the cigar menu.",best:["Nightcap","After the theatre"]},
  skydeck:{about:"Melbourne's highest public viewing platform, on level 88 of Eureka Tower. It has a 360° view from the bay to the Dandenongs, and it's best around golden hour and after dark. Book a timed entry online.",known:"The Edge, a glass cube that slides out from the building, and sunset over the city.",best:["Sunset","First evening"]},
  crown:{about:"A riverside walk along Southbank past Southgate, Crown and the city lights reflected in the Yarra. Lots of bars and restaurants with river views along the way. Lovely after dinner.",known:"The promenade at night and riverside bars.",best:["Evening stroll","Free"]},
  arbory:{about:"A long riverside bar on an old railway platform beside Flinders Street Station, with the Yarra on one side and city views across the water. A Mediterranean-style menu, DJs on weekends and plenty of outdoor seating.",known:"Spritzes, wood-fired pizza and happy-hour oysters.",best:["Afternoon drinks","Riverside"]},
  cherrybar:{about:"Melbourne's legendary rock-and-roll bar. Bands play upstairs, a classic-rock club runs downstairs, and it's open very late. Grungy in the best way, with friendly staff and a photobooth.",known:"Live bands, classic rock till 3am and the photobooth.",best:["Live music","Late night"]},
  everleigh:{about:"A Prohibition-era-style cocktail bar in Fitzroy that's often named among the best in the world. Elegant booths, live jazz on Sundays and immaculate classic cocktails served over hand-cut, crystal-clear ice.",known:"'Bartender's choice': tell them what you like and they'll make something for you.",best:["Date night","Cocktails"]},
  penguins:{about:"Each evening a colony of little penguins returns to the St Kilda breakwater at dusk, just a tram ride from the city. Watch quietly from the viewing area. No flash photography, and volunteers are often on hand to answer questions.",known:"Little penguins coming home at sunset.",best:["Free","Sunset","Unique"]},
  foofighters:{about:"Dave Grohl and the band bring their stadium show to Docklands on the night you arrive. Marvel Stadium is about a 12-minute walk from the Airbnb, so there's no transport stress afterwards.",known:"A long, hit-packed set. Expect a big singalong.",best:["Big night out"]},
  bensonboone:{about:"The 'Beautiful Things' singer's Wanted Man Tour at Rod Laver Arena. Known for big vocals and an athletic stage show.",known:"Huge vocal moments and the backflips.",best:["Pop fans"]},
  msobrahms:{about:"The Melbourne Symphony Orchestra's Brahms Festival continues with two of his greatest symphonies, conducted by Jaime Martín at Hamer Hall on the Yarra.",known:"Brahms' Third and Fourth Symphonies in one evening.",best:["Classical","Dressy night"]},
  myfairlady:{about:"Lerner & Loewe's much-loved musical, about Cockney flower seller Eliza Doolittle and Professor Henry Higgins, opens the newly refurbished Ian Potter State Theatre the day you arrive.",known:"'I Could Have Danced All Night', 'Wouldn't It Be Loverly' and lavish costumes.",best:["Musical theatre","Date night"]},
  roomwithview:{about:"Melbourne Theatre Company stages a romantic comedy based on E. M. Forster's novel about a young Englishwoman whose trip to Florence turns her life upside down.",known:"Romance, wit and Edwardian Italy.",best:["Theatre","Date night"]},
  fiddler:{about:"The acclaimed West End revival of the classic musical about Tevye, his daughters and a changing world, at the grand old Her Majesty's Theatre.",known:"'If I Were a Rich Man', 'Tradition' and a big, moving ensemble.",best:["Musical theatre"]},
  laboheme:{about:"Opera Australia's glittering production of Puccini's romantic tragedy, reset in the cabarets of 1930s Berlin. Sung in Italian with English surtitles. You'll catch the final week.",known:"Puccini's soaring melodies and a heartbreaking final act.",best:["Opera","Romantic night"]},
  khalid:{about:"The R&B singer-songwriter behind 'Location' and 'Young Dumb & Broke' plays Rod Laver Arena.",known:"Smooth vocals and big singalong hits.",best:["R&B fans"]},
  operauplate:{about:"A cheeky, glitzy late-night opera party hosted by cabaret star Reuben Kaye in the gilded Regent Theatre. Big voices and big laughs in 75 minutes, no interval. 16+.",known:"Opera's greatest hits, served with a lot of sequins and sass.",best:["Fun night out","Something different"]},
  joji:{about:"The singer-producer known for moody, lo-fi R&B tracks like 'Glimpse of Us' and 'Slow Dancing in the Dark' plays Rod Laver Arena.",known:"Atmospheric, emotional live sets.",best:["R&B / indie fans"]},
  jackjohnson:{about:"Jack Johnson's Surfilmusic Tour comes to the open-air Sidney Myer Music Bowl, with Ben Harper and John Butler on the bill. A laid-back spring evening of acoustic, surf-rock singalongs.",known:"'Better Together', 'Upside Down' and a lawn full of people singing along.",best:["Outdoor gig","Relaxed night"]},
  msorequiem:{about:"The MSO's Spring Gala closes its Brahms Festival with A German Requiem, featuring the MSO Chorus and Welsh bass-baritone Sir Bryn Terfel. A rare chance to hear Terfel live in Melbourne.",known:"Brahms' most profound choral work and Sir Bryn Terfel.",best:["Classical","Special occasion"]},
  allabouteve:{about:"A new production at the Malthouse Theatre exploring fame, ambition and our obsession with youth, inspired by the classic film. Opens the night before you fly home.",known:"Sharp writing about celebrity and the stage.",best:["Theatre"]},
  atongatem:{about:"A free exhibition of Atong Atem's bold, colourful portrait photography and art at NGV Australia in Federation Square, exploring identity, migration and the African diaspora. It closes the day after you leave.",known:"Vivid studio portraits and new works.",best:["Free","Art lovers"]},
  qvm:{about:"A sprawling open-air market trading since 1878, with fruit and veg sheds, a heritage deli hall, food stalls and souvenirs. It's a 10-minute walk from the Airbnb and the best place to pick up picnic supplies.",known:"Hot jam donuts from the van, the Dairy Produce Hall and the bratwurst.",best:["Morning outing","Picnic supplies"]},
  slv:{about:"Australia's oldest public library, and one of the most beautiful. Head up to the top balcony to look down into the domed La Trobe Reading Room, then check out the free exhibitions inside.",known:"The view down into the domed reading room from level 6.",best:["Free","Rainy day","Photos"]},
  hosier:{about:"Melbourne's most famous street-art laneway, opposite Federation Square, where the walls are repainted constantly so it's never the same twice. Duck into neighbouring Rutledge Lane too.",known:"Ever-changing murals, paste-ups and stencils.",best:["Free","Photos"]},
  degravesst:{about:"The classic Melbourne laneway: a narrow, café-lined strip running into Centre Place, with tiny shops, coffee windows and outdoor tables. It links up neatly with the arcades.",known:"Coffee and people-watching in the laneways.",best:["Free","Wandering"]},
  arcades:{about:"Two beautifully preserved 19th-century shopping arcades with mosaic floors, glass roofs and ornate shopfronts. The Royal Arcade (1869) is Australia's oldest. The Block Arcade is home to the Hopetoun Tea Rooms.",known:"Hopetoun Tea Rooms' cake window and the Royal Arcade's Gog and Magog clock.",best:["Free","Rainy day"]},
  fedsq:{about:"The city's main gathering place, opposite Flinders Street Station, with angular architecture, big screens and free cultural venues. ACMI's free exhibition about film, TV and games is excellent.",known:"ACMI's free 'The Story of the Moving Image' exhibition.",best:["Free","Meeting point"]},
  flinders:{about:"Melbourne's most famous landmark: the yellow 1910 station with its green dome and row of clocks. 'Meet me under the clocks' has been a Melbourne saying for generations.",known:"The clocks over the main entrance and the view at dusk from Fed Square.",best:["Free","Photos"]},
  ngv:{about:"Australia's oldest and most visited art gallery, with a free permanent collection spanning old masters to contemporary design. Walk in through the famous water wall.",known:"The water wall entrance and lying back under the Great Hall's stained-glass ceiling.",best:["Free","Rainy day","Art lovers"]},
  botanic:{about:"Thirty-eight hectares of sweeping lawns, lakes and themed gardens just south of the city. It's beautiful in spring and perfect for a slow afternoon or a picnic with supplies from Queen Vic Market.",known:"Ornamental Lake, the fern gully and picnics on the lawn.",best:["Free","Picnic","Slow afternoon"]},
  shrine:{about:"Melbourne's grand war memorial, set in parkland on St Kilda Rd. Free entry to the galleries, and the upper balcony has one of the best views straight up the boulevard to the city skyline.",known:"The balcony view up St Kilda Road.",best:["Free","History"]},
  reb:{about:"The World Heritage-listed Royal Exhibition Building (1880) in the formal Carlton Gardens, with Melbourne Museum right beside it.",known:"The Royal Exhibition Building's dome, the gardens' fountains and the museum's forest gallery.",best:["Free gardens","History"]},
  mcg:{about:"A behind-the-scenes tour of the Melbourne Cricket Ground, Australia's sporting cathedral, plus the Australian Sports Museum. You walk the members' areas, the change rooms and the edge of the ground.",known:"Standing beside the hallowed turf and the change rooms.",best:["Sports fans"]},
  fitzroy:{about:"Melbourne's coolest inner neighbourhood: Brunswick and Gertrude streets are lined with vintage shops, independent boutiques, bars, street art and some of the city's best cafés.",known:"Vintage shopping, street art, Lune and Gertrude St dinners.",best:["Wandering","Shopping"]},
  stkilda:{about:"Melbourne's seaside suburb: a palm-lined foreshore, a long pier, Luna Park's giant smiling entrance and Acland St's old-school European cake shops. It's 30 minutes away on the 96 tram.",known:"Luna Park's face, Acland St cake shops and the penguins at sunset.",best:["Afternoon out","Beach"]}

    if(Object.keys(sc).length){ const me=whoAmI(), mine=me?scoreOf(me):0; S.scores=Object.assign({},S.scores,sc); if(me) S.scores[me]=Math.max(Number(S.scores[me])||0,mine); }

function clusters(items){

    const st=toMin(it.time), en=it.end?toMin(it.end):st;
    if(cur && (st<cur.maxEnd || cur.starts.has(st))){ cur.list.push(it); cur.starts.add(st); cur.maxEnd=Math.max(cur.maxEnd,en); }
    else { cur={list:[it],starts:new Set([st]),maxEnd:en}; out.push(cur.list); }
  });
  return out;
}

function drawVenue(el){
  const v=SH.v, now=nowMel(); const d=distInfo(v); const inPlan=S.plan.filter(p=>p.ref===v.id);
  const label=(v.t&&v.t[0])?(GROUP_LABEL[v.t[0]]||v.t[0]):CATS[v.cat].title;
  let st='';

  else { const open=v.hrs?isOpenAt(v.hrs[now.wd],now.mins):null;
    st=cell("Rating",v.r?"★ "+v.r.toFixed(1):"–")+(v.cat==="shop"?cell("Suburb",esc(/Fitzroy|Brunswick|St Kilda|Carlton|Kew|Camberwell/.exec(v.area)?.[0]||"CBD")):cell("Price",esc(v.price||"–")))+cell("Distance",d.txt.split(" · ")[0])+cell("Now",open==null?"–":(open?"Open":"Closed"),open==null?"":(open?"open":"closed")); }
  let h='<div class="grab"></div><div class="sh-bar"><span></span>'+closeBtn+'</div>';
  h+='<div class="dv-head">'+tileFor(v)+'<div><h2>'+esc(v.name)+'</h2><p>'+esc(label)+', '+esc(v.area)+'</p></div></div>';
  h+='<div class="stats">'+st+'</div>';

  if(v.known) h+='<div class="lbl">'+(v.cat==="event"?"Highlights":v.cat==="place"?"Don\'t miss":"Known for")+'</div><div class="known">'+esc(v.known)+'</div>';
  if(v.best&&v.best.length) h+='<div class="lbl">Best for</div><div class="bestfor">'+v.best.map(b=>'<span>'+esc(b)+'</span>').join("")+'</div>';
  if(v.tip) h+='<div class="tipbox" style="margin-top:14px"><b>Good to know</b><br>'+esc(v.tip)+'</div>';
  if(v.cat==="event"){
    h+='<div class="lbl">Dates during your trip</div><div class="kv">'+v.sessions.map(s=>'<div><span>'+dayLong(s[0])+'</span><b>'+fmtT(s[1])+'</b></div>').join("")+'</div>';
  } else if(v.hrs){
    h+='<div class="lbl">Opening hours</div><div class="kv">'+[1,2,3,4,5,6,0].map(i=>'<div class="'+(i===now.wd?"today":"")+'"><span>'+WDL[i]+'</span><b>'+esc(fmtRange(v.hrs[i]))+'</b></div>').join("")+'</div>';
  }
  h+='<div class="lbl">More info</div><div class="group links">'+
    '<a class="row" href="'+googleUrl(v)+'" target="_blank" rel="noopener"><span class="tile" style="--c:#4285F4">'+svg("globe")+'</span><span class="rb"><div class="rt">Search on Google</div><div class="rs">Reviews, photos, menus and website</div></span><span class="chev">'+svg("chev","0 0 8 14")+'</span></a>'+
    '<a class="row" href="'+mapUrl(v)+'" target="_blank" rel="noopener"><span class="tile" style="--c:#34A853">'+svg("map")+'</span><span class="rb"><div class="rt">Open in Google Maps</div><div class="rs">Live hours, photos and directions</div></span><span class="chev">'+svg("chev","0 0 8 14")+'</span></a>'+
  '</div>';
  h+='<div class="lbl">Getting there</div><div class="kv"><div><span>From 299 King St</span><b>'+esc(d.txt)+'</b></div></div>';
  if(inPlan.length) h+='<div class="hint good" style="margin-bottom:12px">In your plan: '+inPlan.map(p=>dayLabel(p.day)+(p.time?" at "+fmtT(p.time):"")).join(", ")+'</div>';
  h+='<div class="actions"><a class="btn tinted" href="'+dirUrl(v)+'" target="_blank" rel="noopener">Directions</a><button class="btn" data-add="'+v.id+'">'+svg("plus")+(inPlan.length?" Add again":" Add to plan")+'</button></div>';

}
function syncSheetInputs(){ if(!SH) return; const t=$("#sh-time"),n=$("#sh-note"),nm=$("#sh-name"),en=$("#sh-end"); if(en) SH.end=en.value; if(t) SH.time=t.value; if(n) SH.note=n.value; if(nm) SH.name=nm.value; }
function startAdd(v){ const vd=validDays(v); const day=vd.includes(S.day)?S.day:vd[0]; const s=v.sessions?v.sessions.find(x=>x[0]===day):null;
  const o={mode:"add",v,day,time:s?s[1]:"",note:""}; if(SH){ SH=o; drawSheet(); $("#sheet").scrollTop=0; } else openSheet(o); }

document.addEventListener("click",async e=>{
  const rp=e.target.closest("[data-replay]"); if(rp){ e.preventDefault(); const r=document.getElementById("intro"); if(r){ r.hidden=false; playIntro(true); } return; }
  const rn=e.target.closest("[data-rename]"); if(rn){ e.preventDefault(); ME=""; try{localStorage.removeItem(NKEY);}catch(_){} render(); return; }
  const b=e.target.closest("button,[data-open-v]"); if(!b) return;
  const D=b.dataset;
  if(D.gift){ tapGift(); return; }
  if(D.letter){ tapLetter(); return; }
  if(D.saveinline){ const v=($("#nm-inline").value||"").trim(); if(!v) return; ME=v; try{localStorage.setItem(NKEY,v);}catch(_){} render(); toast("Hi "+v); return; }
  if(D.tab){ closeSheet(); if(S.tab===D.tab){ window.scrollTo({top:0,behavior:"smooth"}); return; } S.tab=D.tab; S.q=""; try{history.replaceState(null,"","#"+S.tab);}catch(_){} render(); window.scrollTo(0,0); return; }
  if(D.seg){ S.foodSeg=D.seg; S.q=""; render(); return; }
  if(D.day && b.classList.contains("wd")){ S.day=D.day; render(); return; }
  if(D.grp){ S.group[exploreCat()]=D.grp; render(); return; }
  if(D.open){ S.openNow=!S.openNow; render(); return; }
  if(D.add){ e.stopPropagation(); startAdd(VBY[D.add]); return; }
  if(D.openV){ openSheet({mode:"venue",v:VBY[D.openV]}); return; }
  if(D.custom){ openSheet({mode:"custom",v:null,day:S.day,time:"",note:"",name:"",icon:"star"}); return; }
  if(D.fixed){ openSheet({mode:"fixed",id:D.fixed}); return; }
  if(D.edit){ const it=S.plan.find(p=>p.id===D.edit); if(!it) return; openSheet({mode:"edit",id:it.id,v:it.ref?VBY[it.ref]:null,day:it.day,time:it.time||"",end:it.end||"",note:it.note||"",name:it.name,icon:it.icon||"star"}); return; }
  if(!SH) return;
  if(D.close){ closeSheet(); return; }
  if(D.sday){ syncSheetInputs(); SH.day=D.sday; if(SH.v&&SH.v.sessions){const s=SH.v.sessions.find(x=>x[0]===SH.day); if(s) SH.time=s[1];} drawSheet(); return; }
  if(D.icon){ syncSheetInputs(); SH.icon=D.icon; const y=$("#sheet").scrollTop; drawSheet(); $("#sheet").scrollTop=y; return; }
  if(D.qt){ syncSheetInputs(); SH.time=D.qt; drawSheet(); return; }
  if(D.notime){ syncSheetInputs(); SH.time=""; SH.end=""; drawSheet(); return; }
  if(D.remove){ const ok=await removeItem(SH.id); if(ok){ closeSheet(); toast("Removed from plan"); } return; }
  if(D.save){
    syncSheetInputs();
    const name=SH.v?SH.v.name:(SH.name||"").trim(); if(!name){ $("#sh-name")?.focus(); return; }
    const data={day:SH.day,time:SH.time||"",end:(SH.time&&SH.end&&SH.end>SH.time)?SH.end:"",note:(SH.note||"").trim().slice(0,500)};
    const wasEdit=SH.mode==="edit", d=SH.day; let ok;
    if(!SH.v) data.icon=SH.icon||"star";
    if(wasEdit){ if(!SH.v) data.name=name; ok=await updateItem(SH.id,data); }
    else ok=await addItem(Object.assign({ref:SH.v?SH.v.id:null,name,cat:SH.v?SH.v.cat:"custom"},data));
    if(ok){ closeSheet(); toast(wasEdit?"Changes saved":"Added to "+dayLabel(d)); if(!wasEdit && S.tab==="plan"){ S.day=d; render(); } }
  }
});

/* ---------- Intro animation ---------- */
const INTRO_KEY="mel-intro-day";
function introSeenToday(){ try{ return localStorage.getItem(INTRO_KEY)===nowMel().ds; }catch(e){ return false; } }
function markIntro(){ try{ localStorage.setItem(INTRO_KEY,nowMel().ds); }catch(e){} }
function playIntro(force){
  const root=$("#intro"); if(!root) return;
  if(!force && introSeenToday()){ root.hidden=true; return; }
  root.hidden=false; root.classList.remove("out");
  ["#headAsh","#winAsh"].forEach(s=>$(s).src=FACE_ASH); ["#headFred","#winFred"].forEach(s=>$(s).src=FACE_FRED);
  const stage=$("#inStage"), cam=$("#inCam"), plane=$("#inPlane"), stairs=$("#inStairs"), sky=$("#inSky"), ka=$("#kidAsh"), kf=$("#kidFred");
  cam.getAnimations().forEach(a=>a.cancel()); [plane,stairs,sky,ka,kf,$("#winAsh"),$("#winFred"),$("#headAsh"),$("#headFred")].forEach(e=>e.getAnimations().forEach(a=>a.cancel()));
  cam.querySelectorAll(".heart").forEach(h=>h.remove());
  const W=stage.clientWidth, H=stage.clientHeight;
  const groundY=H*0.78+10;
  const pw=Math.min(300,W*0.7), ph=pw*106/280;
  const px0=W*0.30, py0=groundY+8-ph*0.98;
  Object.assign(plane.style,{width:pw+"px",height:ph+"px"});
  const sx=pw/280;
  [["#winAsh",176],["#winFred",153]].forEach(([s,cx])=>{ const el=$(s), d=19*sx; Object.assign(el.style,{width:d+"px",height:d+"px",left:(cx*sx-d/2)+"px",top:(46*sx-d/2)+"px"}); });
  const doorX=px0+62*sx, doorBottom=py0+68*sx;
  const stH=groundY+6-doorBottom, stW=stH*1.15;
  Object.assign(stairs.style,{left:(doorX-stW)+"px",top:doorBottom+"px",width:stW+"px",height:stH+"px",opacity:1});
  const kidH=88, footY=groundY+6, kidY=footY-kidH;
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  let done=false; const timers=[];
  const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
  const finish=()=>{ if(done) return; done=true; timers.forEach(clearTimeout); markIntro(); root.classList.add("out"); setTimeout(()=>{ root.hidden=true; },600); };
  $("#inSkip").onclick=finish;
  if(reduce){
    plane.style.transform="translate("+(W*0.5-pw/2)+"px,"+(H*0.42)+"px)"; [ka,kf,stairs].forEach(e=>e.style.opacity=0);
    sky.style.clipPath="inset(0 0 0 0)"; ["#winAsh","#winFred"].forEach(s=>{$(s).style.opacity=1;$(s).style.transform="none";});
    later(finish,2200); return;
  }
  plane.style.transform="translate("+px0+"px,"+py0+"px)";
  const A=(el,frames,opt)=>el.animate(frames,Object.assign({fill:"forwards",easing:"linear"},opt));
  const pos=(x,y,extra)=>`translate(${x}px,${y}px)`+(extra||"");

  /* ---- Scene 1: close-up kiss ---- */
  const kissX=Math.max(64,W*0.15);                  // centre point between them
  const ashX=kissX-50, fredX=kissX+6;  // where they stand for the kiss (kid boxes ~44–48px wide)
  ka.style.transform=pos(ashX-14,kidY); kf.style.transform=pos(fredX+14,kidY);
  // camera starts zoomed in on the couple
  const focusX=kissX, focusY=kidY+30;
  cam.style.transformOrigin="0 0";
  const Z=Math.min(2.4, W/160);
  const camIn=`translate(${W/2-focusX*Z}px,${H*0.52-focusY*Z}px) scale(${Z})`;
  cam.style.transform=camIn;
  // shuffle in towards each other
  A(ka,[{transform:pos(ashX-14,kidY)},{transform:pos(ashX,kidY)}],{duration:450,easing:"ease-out"});
  A(kf,[{transform:pos(fredX+14,kidY)},{transform:pos(fredX,kidY)}],{duration:450,easing:"ease-out"});
  // lean in for a kiss, hold, lean back
  const lean=(el,deg,dx)=>A(el,[
    {transform:"rotate(0deg) translateX(0)"},
    {transform:`rotate(${deg}deg) translateX(${dx}px)`,offset:.3},
    {transform:`rotate(${deg}deg) translateX(${dx}px)`,offset:.75},
    {transform:"rotate(0deg) translateX(0)"}],{duration:1500,delay:450,easing:"ease-in-out"});
  lean($("#headAsh"),14,7); lean($("#headFred"),-14,-7);
  // little bodies tip in too (on the kids' torsos via a short bob)
  // hearts float up from where they kiss
  const HEART='<svg viewBox="0 0 24 22"><path d="M12 21s-9-5.6-9-12.2A5 5 0 0 1 12 6a5 5 0 0 1 9 2.8C21 15.4 12 21 12 21z"/></svg>';
  const spawnHeart=(i)=>{ const h=document.createElement("div"); h.className="heart"; h.innerHTML=HEART;
    const size=10+Math.random()*9, x0=focusX-size/2+(Math.random()*16-8), y0=kidY+8;
    const colors=["#FF4D7A","#FF7AA2","#E5484D","#FF9EBB"]; h.style.color=colors[i%colors.length];
    Object.assign(h.style,{width:size+"px",height:size+"px",left:x0+"px",top:y0+"px"}); cam.appendChild(h);
    const sway=(Math.random()*30-15), rise=50+Math.random()*30;
    h.animate([{transform:"translate(0,0) scale(.3)",opacity:0},{transform:`translate(${sway*.4}px,-${rise*.3}px) scale(1)`,opacity:1,offset:.25},{transform:`translate(${sway}px,-${rise}px) scale(.9)`,opacity:0}],{duration:1300+Math.random()*500,easing:"ease-out",fill:"forwards"});
  };
  for(let i=0;i<9;i++) later(()=>spawnHeart(i),800+i*130);

  /* ---- Scene 2: zoom out to the runway ---- */
  const ZOOM_AT=2050, ZOOM_DUR=1000;
  A(cam,[{transform:camIn},{transform:"translate(0px,0px) scale(1)"}],{duration:ZOOM_DUR,delay:ZOOM_AT,easing:"cubic-bezier(.45,0,.2,1)"});

  /* ---- Scene 3: walk to the plane and hop aboard ---- */
  const D=ZOOM_AT+ZOOM_DUR-150;
  const stairFootX=doorX-stW-8;
  const walk=(el,fromX,toX,delay,dur)=>{ later(()=>el.classList.add("walk"),delay);
    A(el,[{transform:pos(fromX,kidY)},{transform:pos(toX,kidY)}],{duration:dur,delay}); later(()=>el.classList.remove("walk"),delay+dur); };
  const hop=(el,fromX,delay)=>{ const midX=(fromX+doorX)/2, topY=doorBottom-kidH;
    A(el,[
      {transform:pos(fromX,kidY),opacity:1},
      {transform:pos(midX,(footY+doorBottom)/2-kidH-18),opacity:1,offset:.45},
      {transform:pos(doorX-14,topY-6," scale(.92)"),opacity:1,offset:.8},
      {transform:pos(doorX-6,topY+4," scale(.55)"),opacity:0}
    ],{duration:620,delay,easing:"ease-out"}); };
  const front=stairFootX-26, back=stairFootX-72;
  // Fred is on the right, so he reaches the stairs first; Ash follows hand-in-hand behind
  walk(kf,fredX,front,D,1150); walk(ka,ashX,back,D+60,1150);
  hop(kf,front,D+1150);
  walk(ka,back,front,D+1300,340);
  hop(ka,front,D+1660);
  const pop=(s,delay)=>A($(s),[{opacity:0,transform:"scale(.3)"},{opacity:1,transform:"scale(1.25)",offset:.7},{opacity:1,transform:"scale(1)"}],{duration:380,delay,easing:"ease-out"});
  pop("#winFred",D+1700); pop("#winAsh",D+2220);
  A(stairs,[{opacity:1,transform:"translateX(0)"},{opacity:0,transform:"translateX(-30px)"}],{duration:400,delay:D+2450});

  /* ---- Scene 4: take off and skywrite ---- */
  const T0=D+2750;
  const skyRect={top:H*0.19,left:W*0.04,width:W*0.92};
  const cruiseY=skyRect.top+Math.min(140,W*0.34)*0.42-ph*0.5;
  const startCruiseX=skyRect.left-pw*0.98, endX=W+30;
  const cruiseDur=2100;
  A(plane,[
    {transform:`translate(${px0}px,${py0}px) rotate(0deg)`,opacity:1,easing:"ease-in"},
    {transform:`translate(${px0+W*0.12}px,${py0}px) rotate(0deg)`,opacity:1,offset:.16,easing:"ease-in"},
    {transform:`translate(${px0+W*0.36}px,${py0-H*0.05}px) rotate(-12deg)`,opacity:1,offset:.28},
    {transform:`translate(${W*0.98}px,${py0-H*0.28}px) rotate(-18deg)`,opacity:1,offset:.42},
    {transform:`translate(${W+70}px,${py0-H*0.32}px) rotate(-18deg)`,opacity:1,offset:.45},
    {transform:`translate(${W+70}px,${py0-H*0.32}px) rotate(-18deg)`,opacity:0,offset:.455},
    {transform:`translate(${startCruiseX-90}px,${cruiseY}px) rotate(0deg)`,opacity:0,offset:.465},
    {transform:`translate(${startCruiseX-90}px,${cruiseY}px) rotate(0deg)`,opacity:1,offset:.47,easing:"ease-out"},
    {transform:`translate(${startCruiseX}px,${cruiseY}px) rotate(0deg)`,opacity:1,offset:.5},
    {transform:`translate(${endX}px,${cruiseY-6}px) rotate(-2deg)`,opacity:1}
  ],{duration:cruiseDur*2,delay:T0});
  const cruiseStart=T0+cruiseDur, noseTravel=endX-startCruiseX, revealDur=cruiseDur*(skyRect.width/noseTravel);
  A(sky,[{clipPath:"inset(0 100% 0 0)"},{clipPath:"inset(0 0% 0 0)"}],{duration:revealDur,delay:cruiseStart});
  later(finish,cruiseStart+cruiseDur+1400);
}

const GIFT_AT = new Date("2026-11-17T18:00:00+11:00").getTime();
const GIFT_KEY = "mel-gift-opened";
const giftOpened = () => { try{ return localStorage.getItem(GIFT_KEY)==="1"; }catch(e){ return false; } };
function giftCountdown(){
  const ms=GIFT_AT-Date.now(); if(ms<=0) return null;
  const s=Math.floor(ms/1000); return {d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60};
}
function giftRow(it){
  const t=fmtT(it.time);
  const tm='<span class="time">'+t.replace(/(am|pm)$/,"")+'<small>'+(t.match(/(am|pm)$/)||[""])[0]+'</small></span>';
  if(giftOpened()) return '<button class="giftrow" data-gift="1">'+tm+'<div class="opened"><b>JOJI</b><span>Rod Laver Arena · Doors 7:00pm</span><span>Two tickets: Fred &amp; Ash</span><em>▶ Replay the surprise</em></div></button>';

  const inner = c ? '<div class="gwhen">Openable in</div><div class="cdown" id="giftCd">'+cdCells(c)+'</div>'
                  : '<div class="gready">Tap to open 🎁</div>';
  return '<button class="giftrow" data-gift="1" aria-label="A surprise present for Ash">'+tm+'<div class="present'+(c?"":" ready")+'" id="giftBox"><span class="bow"></span><span class="gtag">For Ash 💝</span>'+inner+'</div></button>';

    active=true; count++; (count%2===1 ? ladybug : spider)();
  }
  scheduleNext(GAP_MS);
  window.critterVisit=()=>{ clearTimeout(nextTimer); visit(); }; // for testing
})();


/* ---------- Bug Petting Championship + love-letter prize ---------- */
const LETTER_AT = new Date("2026-11-21T15:00:00+11:00").getTime();   // flight home to Sydney
const LETTER_KEY = "mel-letter-opened", SCORE_KEY = "mel-bug-scores";
const LOVE_LETTER = `My darling Ash,

[Fred: send me your love letter and it'll go right here.]

Love always,
Fred`;
S.scores = (()=>{ try{ return JSON.parse(localStorage.getItem(SCORE_KEY)||"{}"); }catch(e){ return {}; } })();
function whoAmI(){ if(/^ash/i.test(ME||"")) return "Ash"; if(/^fred/i.test(ME||"")) return "Fred"; return null; }
function scoreOf(n){ return Math.max(0, Number((S.scores||{})[n]||0)); }
function onBugPet(){
  const me=whoAmI();
  if(!me){ toast("Set your name on the Plan page to score points 🐞"); return; }
  S.scores=Object.assign({},S.scores,{[me]:scoreOf(me)+1});
  try{ localStorage.setItem(SCORE_KEY,JSON.stringify(S.scores)); }catch(e){}
  if(FB && FB.setScore) FB.setScore(me,{type:"score",name:me,count:scoreOf(me)}).catch(()=>{});
  toast("+1 bug pet for "+me+" 🐞");
  const sb=document.getElementById("scoreboard"); if(sb) sb.outerHTML=scoreboardHTML();
}
window.onBugPet=onBugPet;
function letterCountdown(){ const ms=LETTER_AT-Date.now(); if(ms<=0) return null; const s=Math.floor(ms/1000); return {d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60}; }
const letterOpened=()=>{ try{ return localStorage.getItem(LETTER_KEY)==="1"; }catch(e){ return false; } };
function winner(){ const a=scoreOf("Ash"), f=scoreOf("Fred"); return a>f?"Ash":f>a?"Fred":"tie"; }
function scoreboardHTML(){
  const a=scoreOf("Ash"), f=scoreOf("Fred"), lead=a>f?"Ash":f>a?"Fred":null;
  return '<div class="scoreboard" id="scoreboard"><div class="sb-title">🐞 Bug Petting Championship 🕷️</div>'+
    '<div class="sb-row"><div class="sb-p'+(lead==="Ash"?" lead":"")+'"><span class="sb-av" style="background:'+whoColor("Ash")+'">A</span><b>'+a+'</b><small>Ash'+(lead==="Ash"?" 👑":"")+'</small></div>'+
    '<div class="sb-vs">vs</div>'+
    '<div class="sb-p'+(lead==="Fred"?" lead":"")+'"><span class="sb-av" style="background:'+whoColor("Fred")+'">F</span><b>'+f+'</b><small>Fred'+(lead==="Fred"?" 👑":"")+'</small></div></div>'+
    '<div class="sb-hint">Tap the ladybugs and spiders when they visit. Most pets by the flight home wins the prize below.</div></div>';
}
function letterBoxHTML(){
  const c=letterCountdown();
  if(c) return '<button class="prize" data-letter="1" aria-label="The prize"><span class="bow"></span><span class="gtag">The Prize 🏆</span><div class="gwhen">Winner announced in</div><div class="cdown" id="letterCd">'+cdCells(c)+'</div></button>';
  const w=winner(), me=whoAmI(), canOpen=(w==="tie")||(me===w);
  const title = w==="tie" ? "It's a tie! 🤝" : w+" wins! 🏆";
  const line = letterOpened()&&canOpen ? "💌 Read your letter again" : canOpen ? "Tap to open your prize 🎁" : "Only "+w+" can open this one 😉";
  return '<button class="prize ready" data-letter="1"><span class="bow"></span><span class="gtag">'+title+'</span><div class="gready" style="font-size:18px">'+line+'</div></button>';
}
setInterval(()=>{ const el=document.getElementById("letterCd"); if(!el) return; const c=letterCountdown(); if(c) el.innerHTML=cdCells(c); else if(S.tab==="plan") renderPlan(); },1000);
function tapLetter(){
  const c=letterCountdown();
  if(c){ const b=document.querySelector(".prize"); if(b){ b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); } toast("The winner opens this at 3pm Sat 21 ✈️"); return; }
  const w=winner(), me=whoAmI();
  if(w!=="tie" && me!==w){ toast("Only "+w+" can open this one 😉"); return; }
  playLetter(true);
}
function playLetter(mark){
  const root=$("#letter"); root.hidden=false; requestAnimationFrame(()=>root.classList.add("on"));
  $("#lText").textContent=LOVE_LETTER;
  const env=$("#lEnv"), flap=$("#lFlap"), paper=$("#lPaper"), full=$("#lFull");
  [env,flap,paper,full].forEach(e=>e.getAnimations().forEach(a=>a.cancel())); full.classList.remove("on");
  root.querySelectorAll(".floaty").forEach(e=>e.remove());
  const A=(el,f,o)=>el.animate(f,Object.assign({fill:"forwards"},o));
  A(env,[{transform:"translateY(60vh) scale(.6)",opacity:0},{transform:"translateY(0) scale(1)",opacity:1}],{duration:700,easing:"cubic-bezier(.2,.9,.3,1.2)"});
  A(env,[{transform:"rotate(0)"},{transform:"rotate(-4deg)"},{transform:"rotate(4deg)"},{transform:"rotate(0)"}],{duration:500,delay:900,composite:"add"});
  A(flap,[{transform:"rotateX(0deg)"},{transform:"rotateX(180deg)"}],{duration:600,delay:1500,easing:"ease-in-out"});
  setTimeout(()=>{ flap.style.zIndex=0; },1800);
  A(paper,[{transform:"translateY(0)"},{transform:"translateY(-70%)"}],{duration:800,delay:1900,easing:"ease-out"});
  setTimeout(()=>{ full.classList.add("on"); },2800);
  for(let i=0;i<16;i++) setTimeout(()=>{ const f=document.createElement("div"); f.className="floaty"; f.textContent=["💛","💖","💌","💕","✨"][i%5];
      f.style.left=(20+Math.random()*60)+"%"; f.style.bottom="10%"; root.appendChild(f);
      f.animate([{transform:"translateY(0) scale(.5)",opacity:0},{transform:"translateY(-30px) scale(1)",opacity:1,offset:.2},{transform:`translate(${(Math.random()-.5)*80}px,-260px) scale(.9)`,opacity:0}],{duration:2600,easing:"ease-out",fill:"forwards"}); },1900+i*180);
  if(mark){ try{ localStorage.setItem(LETTER_KEY,"1"); }catch(e){} }
  $("#lClose").onclick=()=>{ root.classList.remove("on"); setTimeout(()=>{ root.hidden=true; },500); render(); };
}

render();
playIntro();
if(location.hash==="#preview-letter"){ const r=document.getElementById("intro"); if(r) r.hidden=true; setTimeout(()=>playLetter(false),300); }
if(location.hash==="#preview-surprise"){ const r=document.getElementById("intro"); if(r) r.hidden=true; setTimeout(()=>playGift(false),300); }
window.addEventListener("load",()=>{ try{ if("serviceWorker" in navigator && window.top===window) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} });
window.addEventListener("online",()=>{ if(S.mode==="offline") setSync("slow"); });
window.addEventListener("offline",()=>{ if(FB) setSync("offline"); });
</script>
<script type="module">
let FIREBASE_CONFIG=null, TRIP_ID="";
try{ const m = await import("./firebase-config.js"); FIREBASE_CONFIG=m.FIREBASE_CONFIG; TRIP_ID=m.TRIP_ID; }catch(e){}
const ready = FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !String(FIREBASE_CONFIG.apiKey).startsWith("PASTE");
if(!ready){ window.firebaseUnavailable(); }
else {
  try{
    const V="10.12.2";
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = initializeApp(FIREBASE_CONFIG);
    let db;
    try{ db = fs.initializeFirestore(app,{ localCache: fs.persistentLocalCache() }); }catch(e){ db = fs.getFirestore(app); }
    const col = fs.collection(db,"trips",TRIP_ID,"plan");
    window.attachFirebase({
      listen:(next,err)=>fs.onSnapshot(col,{includeMetadataChanges:true},snap=>{
        next({ fromCache:snap.metadata.fromCache, items:snap.docs.map(d=>Object.assign({id:d.id},d.data())) });
      },err),
      add:(item)=>fs.addDoc(col,item),
      update:(id,patch)=>fs.updateDoc(fs.doc(col,id),patch),
      remove:(id)=>fs.deleteDoc(fs.doc(col,id)),
      setScore:(name,data)=>fs.setDoc(fs.doc(col,"score_"+name),data,{merge:true})
    });
  }catch(e){ console.error(e); window.firebaseUnavailable(); }
}
</script>
